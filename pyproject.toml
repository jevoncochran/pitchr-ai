[project]
name = "pitchr-ai"
version = "0.1.0"
description = "AI service for PitchR CRM"
readme = "README.md"
authors = [
    { name = "Jevon Cochran", email = "jevon.cochran@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.13.0",
    "fastapi[standard]>=0.143.0",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
